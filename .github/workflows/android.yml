name: Android CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Source tests and Debug verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Validate all 20 wallpaper sources over HTTP and decode
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 scripts/check_wallpaper_urls.py

      - name: Run unit tests when test sources exist
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d app/src/test ]] && find app/src/test -type f \( -name "*Test.kt" -o -name "*Tests.kt" -o -name "*Test.java" \) -print -quit | grep -q .; then
            gradle --no-daemon --stacktrace testDebugUnitTest
          else
            echo "::warning::No unit test source files are present yet; build and APK metadata checks will run."
          fi

      - name: Run Android lint
        run: gradle --no-daemon --stacktrace lintDebug

      - name: Build Debug for CI diagnostics only
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify Debug metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          grep -F "package: name='com.rftv.launcher.debug'" <<< "$BADGING"
          grep -F "sdkVersion:'24'" <<< "$BADGING"
          grep -F "targetSdkVersion:'28'" <<< "$BADGING"
          if grep -q "^native-code:" <<< "$BADGING"; then
            grep "^native-code:" <<< "$BADGING" | grep -q "armeabi-v7a"
          fi

      - name: Verify all 20 bundled wallpaper assets in Debug APK
        run: |
          python3 - <<'PY'
          import zipfile
          apk = "app/build/outputs/apk/debug/app-debug.apk"
          with zipfile.ZipFile(apk) as archive:
              names = [name for name in archive.namelist()
                       if name.startswith("assets/wallpapers/") and name.endswith(".jpg")]
              assert len(names) == 20, f"Expected 20 bundled wallpapers, found {len(names)}"
              for legal in ("assets/third_party/tvos-launcher/LICENSE",
                            "assets/third_party/tvos-launcher/NOTICE",
                            "assets/third_party/THIRD_PARTY_NOTICES.md"):
                  assert legal in archive.namelist(), f"Missing packaged legal notice: {legal}"
              for name in names:
                  data = archive.read(name)
                  assert len(data) > 10_000, f"{name} is too small"
                  assert data[:3] == bytes((0xFF, 0xD8, 0xFF)), f"{name} is not JPEG"
              print(f"Verified {len(names)} packaged JPEG wallpapers")
          PY

      - name: Upload internal Debug diagnostics
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: rftv-launcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Signed Release APK verification
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Require persistent Release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required Release signing secret $name is missing."
              exit 1
            fi
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rftv-release.jks"
          test -s "$RUNNER_TEMP/rftv-release.jks"
          chmod 600 "$RUNNER_TEMP/rftv-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/rftv-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed Release
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify all 20 bundled wallpaper assets in signed Release APK
        run: |
          python3 - <<'PY'
          import zipfile
          apk = "app/build/outputs/apk/release/app-release.apk"
          with zipfile.ZipFile(apk) as archive:
              names = [name for name in archive.namelist()
                       if name.startswith("assets/wallpapers/") and name.endswith(".jpg")]
              assert len(names) == 20, f"Expected 20 bundled wallpapers, found {len(names)}"
              for legal in ("assets/third_party/tvos-launcher/LICENSE",
                            "assets/third_party/tvos-launcher/NOTICE",
                            "assets/third_party/THIRD_PARTY_NOTICES.md"):
                  assert legal in archive.namelist(), f"Missing packaged legal notice: {legal}"
              for name in names:
                  data = archive.read(name)
                  assert len(data) > 10_000, f"{name} is too small"
                  assert data[:3] == bytes((0xFF, 0xD8, 0xFF)), f"{name} is not JPEG"
              print(f"Verified {len(names)} packaged JPEG wallpapers")
          PY

      - name: Verify Release APK identity, SDK, ABI, signature and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          grep -F "package: name='com.rftv.launcher'" <<< "$BADGING"
          grep -F "sdkVersion:'24'" <<< "$BADGING"
          grep -F "targetSdkVersion:'28'" <<< "$BADGING"
          if grep -q "^native-code:" <<< "$BADGING"; then
            grep "^native-code:" <<< "$BADGING" | grep -q "armeabi-v7a"
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee app/build/outputs/apk/release/signature.txt
          sha256sum "$APK" | tee app/build/outputs/apk/release/app-release.apk.sha256
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > app/build/outputs/apk/release/apk-metadata.txt
          test -s app/build/outputs/apk/release/signature.txt
          test -s app/build/outputs/apk/release/app-release.apk.sha256

      - name: Upload signed Release artifact
        uses: actions/upload-artifact@v4
        with:
          name: rftv-launcher-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
            app/build/outputs/apk/release/signature.txt
            app/build/outputs/apk/release/apk-metadata.txt
          if-no-files-found: error
          retention-days: 30
