name: Publish verified Android Release

on:
  workflow_run:
    workflows:
      - Android CI
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish signed APK from successful main CI
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download signed Release artifact
        uses: actions/download-artifact@v4
        with:
          name: rftv-launcher-release
          path: release-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          set +e
          yes | "$SDKMANAGER" --licenses >/dev/null
          LICENSE_STATUS=(${PIPESTATUS[@]})
          set -e
          if [ "${LICENSE_STATUS[1]}" -ne 0 ]; then
            echo "sdkmanager --licenses failed with exit code ${LICENSE_STATUS[1]}" >&2
            exit "${LICENSE_STATUS[1]}"
          fi
          "$SDKMANAGER" --install "build-tools;35.0.0"

      - name: Verify artifact and derive release version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd release-artifact
          APK="app-release.apk"
          test -s "$APK"
          test -s app-release.apk.sha256
          test -s signature.txt
          test -s apk-metadata.txt

          APK_SIZE="$(stat -c '%s' "$APK")"
          test "$APK_SIZE" -gt 100000

          EXPECTED_SHA="$(awk '{print $1}' app-release.apk.sha256)"
          ACTUAL_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"

          grep -F "package: name='com.rftv.launcher'" apk-metadata.txt
          grep -F "versionCode='3' versionName='0.3.0'" apk-metadata.txt
          grep -F "sdkVersion:'24'" apk-metadata.txt
          grep -F "targetSdkVersion:'28'" apk-metadata.txt
          grep -F "Signer #1 certificate SHA-256 digest: 22b4f71da5f543e933780f05f8573783ad4718036b5bfc1b36fe258695e30917" signature.txt

          if grep -q "^native-code:" apk-metadata.txt; then
            grep "^native-code:" apk-metadata.txt | grep -q "armeabi-v7a"
          else
            echo "APK contains no native libraries; it is ABI-independent."
          fi

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum --check app-release.apk.sha256

          VERSION_NAME="$(sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p" apk-metadata.txt)"
          VERSION_CODE="$(sed -n "s/.*versionCode='\\([0-9][0-9]*\\)'.*/\\1/p" apk-metadata.txt)"
          [[ "$VERSION_NAME" =~ ^[0-9]+\\.[0-9]+\\.[0-9]+$ ]]
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]
          VERSION_TAG="v$VERSION_NAME"

          TAG_HTTP="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$VERSION_TAG")"
          if [ "$TAG_HTTP" = "200" ]; then
            echo "::error::Release $VERSION_TAG already exists; refusing to overwrite it."
            exit 1
          elif [ "$TAG_HTTP" != "404" ]; then
            echo "::error::Unable to verify whether release tag $VERSION_TAG exists (HTTP $TAG_HTTP)."
            exit 1
          fi

          LATEST_STABLE_TAG="$(gh release list --limit 100 --json tagName,isDraft,isPrerelease \
            --jq '[.[] | select(.isDraft == false and .isPrerelease == false)][0].tagName // empty')"
          if [ -n "$LATEST_STABLE_TAG" ]; then
            mkdir -p ../previous-release
            gh release download "$LATEST_STABLE_TAG" --pattern apk-metadata.txt --dir ../previous-release
            PREVIOUS_VERSION_CODE="$(sed -n "s/.*versionCode='\\([0-9][0-9]*\\)'.*/\\1/p" ../previous-release/apk-metadata.txt)"
            [[ "$PREVIOUS_VERSION_CODE" =~ ^[0-9]+$ ]]
            if [ "$VERSION_CODE" -le "$PREVIOUS_VERSION_CODE" ]; then
              echo "::error::versionCode $VERSION_CODE must be greater than previous stable versionCode $PREVIOUS_VERSION_CODE."
              exit 1
            fi
          fi

          sha256sum "$APK" > app-release.apk.sha256
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_TAG=$VERSION_TAG" >> "$GITHUB_ENV"
          echo "Verified $APK ($APK_SIZE bytes), $VERSION_TAG, versionCode $VERSION_CODE."

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: RFTV Launcher ${{ env.VERSION_NAME }}
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-artifact/app-release.apk
            release-artifact/app-release.apk.sha256
            release-artifact/apk-metadata.txt
            release-artifact/signature.txt
