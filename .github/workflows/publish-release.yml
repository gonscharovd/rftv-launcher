name: Publish verified Android Release

on:
  workflow_run:
    workflows:
      - Android CI
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: write

concurrency:
  group: rftv-stable-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish signed APK from successful main CI
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download signed Release artifact
        uses: actions/download-artifact@v4
        with:
          name: rftv-launcher-release
          path: release-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          set +e
          yes | "$SDKMANAGER" --licenses >/dev/null
          LICENSE_STATUS=(${PIPESTATUS[@]})
          set -e
          if [ "${LICENSE_STATUS[1]}" -ne 0 ]; then
            echo "sdkmanager --licenses failed with exit code ${LICENSE_STATUS[1]}" >&2
            exit "${LICENSE_STATUS[1]}"
          fi
          "$SDKMANAGER" --install "build-tools;35.0.0"

      - name: Verify artifact and derive release version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd release-artifact
          APK="app-release.apk"
          test -s "$APK"
          test -s app-release.apk.sha256
          test -s signature.txt
          test -s apk-metadata.txt

          APK_SIZE="$(stat -c '%s' "$APK")"
          test "$APK_SIZE" -gt 100000

          EXPECTED_SHA="$(awk '{print $1}' app-release.apk.sha256)"
          ACTUAL_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"

          grep -F "package: name='com.rftv.launcher'" apk-metadata.txt
          grep -F "sdkVersion:'24'" apk-metadata.txt
          grep -F "targetSdkVersion:'28'" apk-metadata.txt
          grep -F "Signer #1 certificate SHA-256 digest: 22b4f71da5f543e933780f05f8573783ad4718036b5bfc1b36fe258695e30917" signature.txt

          if grep -q "^native-code:" apk-metadata.txt; then
            grep "^native-code:" apk-metadata.txt | grep -q "armeabi-v7a"
          else
            echo "APK contains no native libraries; it is ABI-independent."
          fi

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          # Normalize the checksum filename after confirming the downloaded artifact hash.
          sha256sum "$APK" > app-release.apk.sha256
          sha256sum --check app-release.apk.sha256

          VERSION_NAME="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" apk-metadata.txt)"
          VERSION_CODE="$(sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p" apk-metadata.txt)"
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]
          VERSION_TAG="v$VERSION_NAME"

          LATEST_STABLE_TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,isPrerelease \
            --jq '[.[] | select(.isDraft == false and .isPrerelease == false)][0].tagName // empty')"
          if [ -n "$LATEST_STABLE_TAG" ]; then
            mkdir -p ../previous-release
            gh release download "$LATEST_STABLE_TAG" --repo "$GITHUB_REPOSITORY" --pattern apk-metadata.txt --dir ../previous-release
            PREVIOUS_VERSION_CODE="$(sed -n "s/.*versionCode='\\([0-9][0-9]*\\)'.*/\\1/p" ../previous-release/apk-metadata.txt)"
            [[ "$PREVIOUS_VERSION_CODE" =~ ^[0-9]+$ ]]
            if [ "$VERSION_CODE" -le "$PREVIOUS_VERSION_CODE" ]; then
              echo "SKIP_RELEASE=true" >> "$GITHUB_ENV"
              echo "::notice::versionCode $VERSION_CODE is already covered by stable $LATEST_STABLE_TAG (versionCode $PREVIOUS_VERSION_CODE); no new release is needed."
              exit 0
            fi
          fi

          TAG_HTTP="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$VERSION_TAG")"
          REF_HTTP="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION_TAG")"
          if [ "$REF_HTTP" = "200" ]; then
            echo "::error::Git tag $VERSION_TAG already exists; refusing to reuse it."
            exit 1
          elif [ "$REF_HTTP" != "404" ]; then
            echo "::error::Unable to verify whether tag $VERSION_TAG exists (HTTP $REF_HTTP)."
            exit 1
          fi
          if [ "$TAG_HTTP" = "200" ]; then
            echo "::error::Release $VERSION_TAG already exists; refusing to overwrite it."
            exit 1
          elif [ "$TAG_HTTP" != "404" ]; then
            echo "::error::Unable to verify whether release tag $VERSION_TAG exists (HTTP $TAG_HTTP)."
            exit 1
          fi

          DRAFTS_JSON="$(curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          DRAFT_RELEASE_ID="$(jq -r --arg tag "$VERSION_TAG" '[.[] | select(.tag_name == $tag and .draft == true and .prerelease == false)][0].id // empty' <<< "$DRAFTS_JSON")"

          echo "SKIP_RELEASE=false" >> "$GITHUB_ENV"
          echo "APK_SHA256=$ACTUAL_SHA" >> "$GITHUB_ENV"
          echo "APK_SIZE=$APK_SIZE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_TAG=$VERSION_TAG" >> "$GITHUB_ENV"
          echo "EXISTING_DRAFT_RELEASE_ID=$DRAFT_RELEASE_ID" >> "$GITHUB_ENV"
          echo "Verified $APK ($APK_SIZE bytes), $VERSION_TAG, versionCode $VERSION_CODE."

      - name: Publish GitHub Release
        id: create_release
        if: env.SKIP_RELEASE != 'true' && env.EXISTING_DRAFT_RELEASE_ID == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: RFTV Launcher ${{ env.VERSION_NAME }}
          generate_release_notes: true
          draft: true
          prerelease: false
          make_latest: false
          files: |
            release-artifact/app-release.apk
            release-artifact/app-release.apk.sha256
            release-artifact/apk-metadata.txt
            release-artifact/signature.txt

      - name: Refresh assets in an existing unpublished draft
        if: env.SKIP_RELEASE != 'true' && env.EXISTING_DRAFT_RELEASE_ID != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ env.VERSION_TAG }}
          RELEASE_ID: ${{ env.EXISTING_DRAFT_RELEASE_ID }}
          EXPECTED_APK_SHA256: ${{ env.APK_SHA256 }}
          EXPECTED_APK_SIZE: ${{ env.APK_SIZE }}
        run: |
          set -euo pipefail
          RELEASE_JSON="$(curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          test "$(jq -r '.tag_name' <<< "$RELEASE_JSON")" = "$VERSION_TAG"
          test "$(jq -r '.draft' <<< "$RELEASE_JSON")" = "true"
          test "$(jq -r '.prerelease' <<< "$RELEASE_JSON")" = "false"
          CURRENT_SHA="$(jq -r '.assets[] | select(.name == "app-release.apk") | .digest // empty' <<< "$RELEASE_JSON")"
          CURRENT_SIZE="$(jq -r '.assets[] | select(.name == "app-release.apk") | .size // empty' <<< "$RELEASE_JSON")"
          ASSETS_COMPLETE=true
          for required_asset in app-release.apk app-release.apk.sha256 apk-metadata.txt signature.txt; do
            if ! jq -e --arg name "$required_asset" '.assets[] | select(.name == $name)' <<< "$RELEASE_JSON" >/dev/null; then
              ASSETS_COMPLETE=false
            fi
          done
          if [ "$CURRENT_SHA" = "sha256:$EXPECTED_APK_SHA256" ] && [ "$CURRENT_SIZE" = "$EXPECTED_APK_SIZE" ] && [ "$ASSETS_COMPLETE" = "true" ]; then
            echo "Existing draft already contains this exact verified APK and all required assets; reusing."
            exit 0
          fi

          UPLOAD_URL="$(jq -r '.upload_url // empty' <<< "$RELEASE_JSON")"
          UPLOAD_BASE="${UPLOAD_URL%%\{*}"
          test -n "$UPLOAD_BASE"
          while IFS= read -r asset_id; do
            [ -z "$asset_id" ] && continue
            curl -fsS -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" >/dev/null
          done <<< "$(jq -r '.assets[].id' <<< "$RELEASE_JSON")"

          for asset_name in app-release.apk app-release.apk.sha256 apk-metadata.txt signature.txt; do
            asset_path="release-artifact/$asset_name"
            test -s "$asset_path"
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$asset_path" \
              "$UPLOAD_BASE?name=$asset_name" >/dev/null
          done
          echo "Existing draft assets replaced with the current verified CI artifact."

      - name: Verify draft assets match the verified APK
        if: env.SKIP_RELEASE != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ env.VERSION_TAG }}
          EXISTING_DRAFT_RELEASE_ID: ${{ env.EXISTING_DRAFT_RELEASE_ID }}
          CREATED_RELEASE_ID: ${{ steps.create_release.outputs.id }}
          EXPECTED_APK_SHA256: ${{ env.APK_SHA256 }}
          EXPECTED_APK_SIZE: ${{ env.APK_SIZE }}
        run: |
          set -euo pipefail
          RELEASE_ID="${EXISTING_DRAFT_RELEASE_ID:-$CREATED_RELEASE_ID}"
          test -n "$RELEASE_ID"
          RELEASE_JSON="$(curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          test "$(jq -r '.tag_name' <<< "$RELEASE_JSON")" = "$VERSION_TAG"
          test "$(jq -r '.draft' <<< "$RELEASE_JSON")" = "true"
          test "$(jq -r '.prerelease' <<< "$RELEASE_JSON")" = "false"
          ASSET_SHA="$(jq -r '.assets[] | select(.name == "app-release.apk") | .digest // empty' <<< "$RELEASE_JSON")"
          ASSET_SIZE="$(jq -r '.assets[] | select(.name == "app-release.apk") | .size // empty' <<< "$RELEASE_JSON")"
          test "$ASSET_SHA" = "sha256:$EXPECTED_APK_SHA256"
          test "$ASSET_SIZE" = "$EXPECTED_APK_SIZE"
          for asset in app-release.apk app-release.apk.sha256 apk-metadata.txt signature.txt; do
            jq -e --arg name "$asset" '.assets[] | select(.name == $name)' <<< "$RELEASE_JSON" >/dev/null
          done
          echo "Draft assets verified against the signed build: $ASSET_SHA ($ASSET_SIZE bytes)."

      - name: Publish verified stable Release
        if: env.SKIP_RELEASE != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ env.VERSION_TAG }}
          EXISTING_DRAFT_RELEASE_ID: ${{ env.EXISTING_DRAFT_RELEASE_ID }}
          CREATED_RELEASE_ID: ${{ steps.create_release.outputs.id }}
          EXPECTED_APK_SHA256: ${{ env.APK_SHA256 }}
          EXPECTED_APK_SIZE: ${{ env.APK_SIZE }}
        run: |
          set -euo pipefail
          RELEASE_ID="${EXISTING_DRAFT_RELEASE_ID:-$CREATED_RELEASE_ID}"
          test -n "$RELEASE_ID"
          RELEASE_JSON="$(curl -fsS -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d '{"draft":false,"prerelease":false,"make_latest":"true"}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          test "$(jq -r '.draft' <<< "$RELEASE_JSON")" = "false"
          test "$(jq -r '.prerelease' <<< "$RELEASE_JSON")" = "false"
          ASSET_SHA="$(jq -r '.assets[] | select(.name == "app-release.apk") | .digest // empty' <<< "$RELEASE_JSON")"
          ASSET_SIZE="$(jq -r '.assets[] | select(.name == "app-release.apk") | .size // empty' <<< "$RELEASE_JSON")"
          test "$ASSET_SHA" = "sha256:$EXPECTED_APK_SHA256"
          test "$ASSET_SIZE" = "$EXPECTED_APK_SIZE"
          echo "Stable Release $VERSION_TAG published and verified: $ASSET_SHA ($ASSET_SIZE bytes)."
